<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>PillDrop Admin</title>
<style>
:root{--bg:#0d1512;--card:#151f1b;--fg:#e6f2ed;--muted:#8fa79d;--line:#243630;--acc:#2fd0a0;--accfg:#06231a;--bad:#ff8a80;--ok:#3ddba7;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f3f7f5;--card:#fff;--fg:#10211b;--muted:#5b6f67;--line:#d5e2dc;--acc:#0f9d78;--accfg:#fff;--bad:#b3261e;--ok:#0b7a58;color-scheme:light}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans Bengali",sans-serif;padding:20px 16px}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
input:focus{outline:2px solid var(--acc);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 14px;background:var(--acc);color:var(--accfg);cursor:pointer;flex:1 1 120px}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}button.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
#msg{min-height:22px;font-size:14px;overflow-wrap:anywhere}.ok{color:var(--ok)}.err{color:var(--bad)}small{color:var(--muted)}
</style></head><body><main>
<h1>PillDrop Admin</h1>
<div class="card" id="login">
 <label>অ্যাডমিন পাসওয়ার্ড<input id="pw" type="password" autocomplete="current-password"></label>
 <label>Authenticator কোড (৬ অঙ্ক)<input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></label>
 <button id="enter">প্রবেশ করুন</button>
</div>
<div class="card" id="panel" hidden>
 <label>API Base URL<input id="base" inputmode="url" placeholder="https://freemodel.in/v1"></label>
 <label>Model<input id="model" placeholder="claude-opus-5-5"></label>
 <label>API Key <small id="keyhint"></small><input id="key" type="password" autocomplete="off" placeholder="নতুন key দিন (ফাঁকা রাখলে আগেরটাই থাকবে)"></label>
 <div class="row"><button id="save">সেভ করুন</button><button id="test" class="alt">টেস্ট করুন</button></div>
 <button id="reset" class="danger">ডিফল্টে ফিরুন</button>
 <button id="logout" class="alt">লগআউট</button>
</div>
<div id="msg" role="status"></div>
</main>
<script>var API="https://pilldrop-api.bbbijoybb.workers.dev",tok="";
var $=function(i){return document.getElementById(i)};
function say(t,c){var m=$("msg");m.textContent=t;m.className=c||""}
async function raw(path,method,body,auth){
 var h={"Content-Type":"application/json"};if(auth)h.Authorization="Bearer "+auth;
 var r=await fetch(API+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined});
 var d={};try{d=await r.json()}catch(e){}return{s:r.status,d:d}}
function toLogin(m){tok="";$("panel").hidden=true;$("login").hidden=false;$("pw").value="";$("code").value="";if(m)say(m,"err")}
async function call(path,method,body){
 var r=await raw(path,method,body,tok);
 if(r.s===401){toLogin("সেশন শেষ। আবার লগইন করুন।")}return r}
function fill(d){$("base").value=d.base||"";$("model").value=d.model||"";$("key").value="";
 $("key").disabled=d.key_editable===false;
 $("keyhint").textContent=d.has_key?"(বর্তমান: "+d.key+")":"(কোনো key নেই)"}
async function load(){var r=await call("/admin/config","GET");if(r.d.ok){fill(r.d);$("login").hidden=true;$("panel").hidden=false}}
$("enter").onclick=async function(){
 var pw=$("pw").value,code=$("code").value.replace(/\s/g,"");
 if(!pw||code.length!==6){say("পাসওয়ার্ড ও ৬ অঙ্কের কোড দিন।","err");return}
 say("যাচাই হচ্ছে…");
 try{var r=await raw("/admin/login","POST",{password:pw,code:code});
  if(r.s===401){say("পাসওয়ার্ড বা কোড ভুল। (একই কোড দুইবার চলে না, নতুন কোডের জন্য ৩০ সেকেন্ড অপেক্ষা করুন।)","err");return}
  if(r.s===429){say("অনেকবার ভুল হয়েছে। ১৫ মিনিট পরে চেষ্টা করুন।","err");return}
  if(!r.d.ok){say("সার্ভার সেট করা নেই ("+(r.d.error||r.s)+"). Worker-এ ADMIN_KEY, ADMIN_TOTP ও CONFIG KV যোগ করুন।","err");return}
  tok=r.d.token;$("pw").value="";$("code").value="";say("লগইন হয়েছে। সেশন "+r.d.minutes+" মিনিট চলবে।","ok");await load()}
 catch(e){say("সার্ভারে পৌঁছানো যায়নি।","err")}};
$("code").onkeydown=$("pw").onkeydown=function(e){if(e.key==="Enter")$("enter").click()};
$("save").onclick=async function(){
 var r=await call("/admin/config","POST",{base:$("base").value,model:$("model").value,key:$("key").value});
 if(r.d.ok){say("সেভ হয়েছে।","ok");load()}else if(r.s!==401)say(r.d.error==="base_not_allowed"?"এই সার্ভার অনুমোদিত নয়। Cloudflare-এ worker.js-এর ALLOWED_BASES তালিকায় যোগ করুন।":r.d.error==="key_required_when_base_changes"?"সার্ভার বদলাতে নতুন API Key-ও দিতে হবে।":"সেভ হয়নি: "+(r.d.error||r.s),"err")};
$("test").onclick=async function(){say("টেস্ট চলছে…");
 var r=await call("/admin/test","POST");
 if(r.d.ok)say("AI সংযোগ ঠিক আছে (status "+r.d.status+").","ok");else if(r.s!==401)say("সমস্যা: "+(r.d.error||("status "+r.d.status+" "+(r.d.sample||""))),"err")};
$("reset").onclick=async function(){
 if($("reset").dataset.sure!=="1"){$("reset").dataset.sure="1";$("reset").textContent="নিশ্চিত? আবার চাপুন";setTimeout(function(){$("reset").dataset.sure="";$("reset").textContent="ডিফল্টে ফিরুন"},4000);return}
 $("reset").dataset.sure="";$("reset").textContent="ডিফল্টে ফিরুন";
 var r=await call("/admin/config","POST",{reset:true});
 if(r.d.ok){say("ডিফল্টে ফিরেছে।","ok");load()}else if(r.s!==401)say("ব্যর্থ: "+(r.d.error||r.s),"err")};
$("logout")&&($("logout").onclick=function(){toLogin("লগআউট হয়েছে।")});
</script></body></html>
