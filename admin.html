<script>var API="https://pilldrop-api.bbbijoybb.workers.dev",tok="";

var LANG="bn",TH="",hint=null;

 $("lgb").textContent=LANG==="bn"?"English":"বাংলা";$("reset").textContent=T("reset");$("reset").dataset.sure="";paintHint();$("msg").textContent=""}

  if(r.s===401){say(L("পাসওয়ার্ড বা কোড ভুল। (একই কোড দুইবার চলে না, নতুন কোডের জন্য ৩০ সেকেন্ড অপেক্ষা করুন।)","Wrong password or code. (A code can't be used twice; wait 30 seconds for a new one.)"),"err");return}

 catch(e){say(L("সার্ভারে পৌঁছানো যায়নি।","Could not reach the server."),"err")}};
